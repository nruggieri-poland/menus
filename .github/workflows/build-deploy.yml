name: Build and Deploy Menus

on:
  schedule:
    # Twice a week (Monday + Thursday) at 6:00 AM Eastern (11:00 UTC)...
    - cron: "0 11 * * 1,4"
    # ...plus always on the 1st of the month, regardless of what weekday
    # that falls on, so the new current-/next- PDF pair is never late.
    - cron: "0 11 1 * *"
  workflow_dispatch:
    inputs:
      year:
        description: "Single year (YYYY) — leave blank for rolling window"
        required: false
      month:
        description: "Single month (1-12) — leave blank for rolling window"
        required: false
      back:
        description: "Months to look back (default 1)"
        required: false
        default: "1"
      ahead:
        description: "Months to look ahead (default 1)"
        required: false
        default: "1"
  push:
    branches: ["master"]
    paths:
      - "scripts/**"
      - "site/embed/menu-widget.js"
      - ".github/workflows/build-deploy.yml"

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install poppler + font (PDF -> image rendering for preview cards)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch menus
        run: |
          cd scripts
          YEAR="${{ github.event.inputs.year }}"
          MONTH="${{ github.event.inputs.month }}"
          BACK="${{ github.event.inputs.back || '1' }}"
          AHEAD="${{ github.event.inputs.ahead || '1' }}"

          if [ -n "$YEAR" ] && [ -n "$MONTH" ]; then
            echo "Single-month mode: $YEAR-$MONTH"
            python fetch_menus.py --year "$YEAR" --month "$MONTH"
          else
            echo "Rolling window mode: $BACK months back, $AHEAD months ahead"
            python fetch_menus.py --back "$BACK" --ahead "$AHEAD"
          fi

      - name: Generate PDF calendars
        run: |
          cd scripts
          python generate_pdf.py

      - name: Generate PDF preview thumbnails
        run: |
          cd scripts
          python generate_thumbnails.py

      - name: Build site (accessible pages, calendars, embed guide, Finalsite embeds)
        run: |
          cd scripts
          python build_site.py
          python build_pages.py
          python build_finalsite_embeds.py

      - name: Commit updated menu data and widget files
        # data/ (4 small rollup files) and widgets/ (4 paste-into-Finalsite
        # files, only change if assets/embed/menu-widget.js changes) are
        # committed — cheap to keep in git history, and widgets/ needs to be
        # committed since it's meant to be browsed/copied from GitHub
        # directly. site/ is pure build output (fully regenerated every run)
        # and is deployed straight to Pages below — it's never committed, so
        # it never bloats git history.
        #
        # Retries with rebase on a rejected push: the twice-weekly cron and
        # the 1st-of-month cron fire at the same time whenever the 1st lands
        # on a Monday or Thursday (roughly 2 out of every 7 months), and a
        # manual workflow_dispatch run can also overlap a scheduled one —
        # the concurrency group above should serialize these, but this is
        # a cheap, harmless belt-and-suspenders fix either way.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ widgets/
          if git diff --cached --quiet; then
            echo "No menu/widget changes to commit."
            exit 0
          fi
          git commit -m "chore: update menu data $(date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejected (attempt $i/5) — another run likely landed a commit first; pulling and retrying..."
            git pull --rebase origin master
          done
          echo "::error::Push failed after 5 retries"
          exit 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site/"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
