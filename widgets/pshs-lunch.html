<!-- Poland Schools menu widget — Poland Seminary High School Lunch
     Paste this entire block into the Finalsite Custom HTML component for
     this page. No external script/library dependencies, no HTML markup
     needed (the script creates its own container). All CSS/JS in this file
     is namespaced to this specific feed, so it's safe to paste alongside
     any of the other three widget files on the same page. The MENU DATA is
     never hardcoded — the only network request this makes is to fetch the
     current menu JSON from the repo, so it always shows live data.
     Source: scripts/build_finalsite_embeds.py (do not hand-edit; regenerate
     instead if assets/embed/menu-widget.js changes). -->
<script>
(function () {
  'use strict';

  var REPO_DATA_BASE = 'https://raw.githubusercontent.com/nruggieri-poland/menus/refs/heads/master/data/';

  var DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
  var MONTH_NAMES = ['', 'January', 'February', 'March', 'April', 'May', 'June',
    'July', 'August', 'September', 'October', 'November', 'December'];
  var SCHOOL_NAMES = {
    'pshs': 'Poland Seminary High School',
    'mckinley-middle': 'McKinley/Middle School'
  };

  // ── Helpers ────────────────────────────────────────────────────────────

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  function dateKey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }

  function parseDateKey(key) {
    var parts = key.split('-');
    return new Date(+parts[0], +parts[1] - 1, +parts[2]);
  }

  function sameDay(a, b) { return dateKey(a) === dateKey(b); }

  function addDays(d, n) { var r = new Date(d); r.setDate(r.getDate() + n); return r; }

  function getMonday(d) {
    var day = new Date(d);
    var diff = (day.getDay() + 6) % 7;
    day.setDate(day.getDate() - diff);
    day.setHours(0, 0, 0, 0);
    return day;
  }

  function fmtDate(d) {
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  function fmtDateFull(d) {
    return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  }

  function fmtDateLong(d) {
    return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  }

  function daysInMonth(year, month) { return new Date(year, month, 0).getDate(); }

  // ── Data fetch: one rollup file per feed, shared across all widget
  // instances on the page and cached for the page's lifetime ──────────────

  var rollupCache = {};

  function fetchRollup(school, menutype) {
    var key = school + '/' + menutype;
    if (rollupCache[key]) return rollupCache[key];
    var filename = menutype + '-' + school + '.json';
    rollupCache[key] = fetch(REPO_DATA_BASE + filename)
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (data) {
        var itemMap = {};
        (data.days || []).forEach(function (d) { itemMap[d.date] = d.items; });
        return itemMap;
      })
      .catch(function () { return null; });
    return rollupCache[key];
  }

  // ── Stylesheet (injected once, scoped under .psmenu-pshs-lunch) ─────────────────────

  var CSS = ''
    + '.psmenu-pshs-lunch{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1a1a2e;background:#fff;line-height:1.5;}'
    + '.psmenu-pshs-lunch *,.psmenu-pshs-lunch *::before,.psmenu-pshs-lunch *::after{box-sizing:border-box;}'
    + '.psmenu-pshs-lunch a{color:#0d2870;}'
    + '.psmenu-pshs-lunch .psmenu-pshs-lunch-sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}'
    + '.psmenu-pshs-lunch .psmenu-pshs-lunch-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem 1rem;padding-bottom:.75rem;}'
    + '.psmenu-pshs-lunch .psmenu-pshs-lunch-announce{color:#1a3e9c;font-size:1.5rem;font-weight:700;margin:0;}'
    + '.psmenu-pshs-lunch .psmenu-pshs-lunch-announce:focus-visible{outline:3px solid #0b57d0;outline-offset:4px;border-radius:2px;}'
    + '.psmenu-pshs-lunch .psmenu-pshs-lunch-nav{display:flex;justify-content:flex-end;gap:.5rem;flex-shrink:0;align-items:center;flex-wrap:wrap;}'
    + '.psmenu-pshs-lunch .psmenu-pshs-lunch-nav button{background:#2d3748;color:#fff;border:0;border-radius:8px;padding:.55rem .95rem;font-size:.85rem;font-weight:600;cursor:pointer;min-height:44px;min-width:44px;}'
    + '.psmenu-pshs-lunch .psmenu-pshs-lunch-nav button:hover{background:#1c2536;}'
    + '.psmenu-pshs-lunch .psmenu-pshs-lunch-nav button:disabled{opacity:.4;cursor:default;}'
    + '.psmenu-pshs-lunch button:focus-visible{outline:3px solid #0b57d0;outline-offset:2px;}'
    + '.psmenu-pshs-lunch .psmenu-pshs-lunch-print{background:none !important;color:#0d2870 !important;text-decoration:underline;font-weight:400 !important;}'
    + '.psmenu-pshs-lunch .psmenu-pshs-lunch-daylist{border:1px solid #d8dee9;border-radius:10px;overflow:hidden;}'
    + '.psmenu-pshs-lunch .psmenu-pshs-lunch-day + .psmenu-pshs-lunch-day{border-top:1px solid #d8dee9;}'
    + '.psmenu-pshs-lunch .psmenu-pshs-lunch-day-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:.35rem .75rem;background:#eef0f2;padding:.7rem 1.25rem;}'
    + '.psmenu-pshs-lunch .psmenu-pshs-lunch-day.today .psmenu-pshs-lunch-day-head{background:#dce6fb;}'
    + '.psmenu-pshs-lunch .psmenu-pshs-lunch-day-head h3{font-size:1.05rem;color:#1a3e9c;margin:0;display:inline-flex;align-items:center;gap:.5rem;font-weight:700;}'
    + '.psmenu-pshs-lunch .psmenu-pshs-lunch-day-head .psmenu-pshs-lunch-date{font-weight:700;color:#1a3e9c;font-size:1rem;}'
    + '.psmenu-pshs-lunch .psmenu-pshs-lunch-flag{font-size:.65rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#0d2870;background:#cfe0fb;padding:.15rem .5rem;border-radius:999px;}'
    + '.psmenu-pshs-lunch .psmenu-pshs-lunch-day-body{padding:1rem 1.25rem 1.25rem;background:#fff;}'
    + '.psmenu-pshs-lunch ul.psmenu-pshs-lunch-items{list-style:none;margin:0;padding:0;}'
    + '.psmenu-pshs-lunch ul.psmenu-pshs-lunch-items li{padding-left:1.1rem;position:relative;margin-bottom:.4rem;color:#333;}'
    + '.psmenu-pshs-lunch ul.psmenu-pshs-lunch-items li:first-child::before{content:"";position:absolute;left:0;top:.55em;width:8px;height:8px;border-radius:50%;background:#1a3e9c;}'
    + '.psmenu-pshs-lunch .psmenu-pshs-lunch-toggle{display:flex;justify-content:center;margin-top:1.25rem;}'
    + '.psmenu-pshs-lunch .psmenu-pshs-lunch-toggle button{background:#1a3e9c;color:#fff;border:0;padding:.65rem 1.5rem;border-radius:8px;font-weight:600;cursor:pointer;min-height:44px;}'
    + '.psmenu-pshs-lunch .psmenu-pshs-lunch-toggle button:hover{background:#0d2870;}'
    + '.psmenu-pshs-lunch table.psmenu-pshs-lunch-cal{border-collapse:collapse;width:100%;margin-top:.5rem;table-layout:fixed;}'
    + '.psmenu-pshs-lunch table.psmenu-pshs-lunch-cal caption{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}'
    + '.psmenu-pshs-lunch table.psmenu-pshs-lunch-cal th,.psmenu-pshs-lunch table.psmenu-pshs-lunch-cal td{border:1px solid #d8dee9;vertical-align:top;padding:.5rem;}'
    + '.psmenu-pshs-lunch table.psmenu-pshs-lunch-cal thead th{background:#1a3e9c;color:#fff;text-align:center;padding:.6rem;font-size:.9rem;}'
    + '.psmenu-pshs-lunch table.psmenu-pshs-lunch-cal td{width:20%;}'
    + '.psmenu-pshs-lunch table.psmenu-pshs-lunch-cal td.psmenu-pshs-lunch-empty{background:#f2f4f8;}'
    + '.psmenu-pshs-lunch .psmenu-pshs-lunch-daynum{font-weight:700;color:#1a3e9c;display:block;text-align:right;margin-bottom:.3rem;font-size:.85rem;}'
    + '.psmenu-pshs-lunch table.psmenu-pshs-lunch-cal ul{list-style:none;margin:0;padding:0;font-size:.8rem;}'
    + '.psmenu-pshs-lunch table.psmenu-pshs-lunch-cal ul li{margin-bottom:.25rem;color:#333;}'
    + '.psmenu-pshs-lunch .psmenu-pshs-lunch-status{padding:2rem 1rem;text-align:center;color:#475569;}'
    // Mobile calendar: a compact tappable day-number grid + single-day
    // detail panel below it, instead of stacking the whole month's table
    // (every day, every item, past and future) into one long list — that
    // was the old mobile fallback, and it buried the day you actually care
    // about under weeks of already-passed, now-irrelevant menu text.
    + '.psmenu-pshs-lunch-cal-compact{display:none;}'
    + '.psmenu-pshs-lunch-minigrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:.5rem;}'
    + '.psmenu-pshs-lunch-mg-head{font-size:.7rem;font-weight:700;color:#1a3e9c;text-align:center;text-transform:uppercase;letter-spacing:.04em;padding-bottom:4px;}'
    + '.psmenu-pshs-lunch-mg-cell{-webkit-appearance:none;appearance:none;font-family:inherit;cursor:pointer;position:relative;aspect-ratio:1;min-height:44px;border:1px solid #d8dee9;border-radius:8px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.95rem;font-weight:600;color:#1a1a2e;}'
    + '.psmenu-pshs-lunch-mg-cell.has-items{border-color:#a9bde8;}'
    + '.psmenu-pshs-lunch-mg-cell.today{border-color:#1a3e9c;border-width:2px;}'
    + '.psmenu-pshs-lunch-mg-cell.selected{background:#1a3e9c;border-color:#1a3e9c;color:#fff;}'
    + '.psmenu-pshs-lunch-mg-cell.selected .psmenu-pshs-lunch-mg-dot{background:#fff;}'
    + '.psmenu-pshs-lunch-mg-dot{width:5px;height:5px;border-radius:50%;background:#1a3e9c;}'
    + '.psmenu-pshs-lunch-mg-empty{visibility:hidden;}'
    + '.psmenu-pshs-lunch-daydetail{margin-top:1rem;border:1px solid #d8dee9;border-radius:10px;padding:1rem 1.1rem;background:#f8faff;}'
    + '.psmenu-pshs-lunch-daydetail-head h3{font-size:1.05rem;color:#1a3e9c;margin:0 0 .6rem;display:flex;align-items:center;gap:.5rem;}'
    + '.psmenu-pshs-lunch-no-menu{color:#475569;font-style:italic;opacity:.7;margin:0;}'
    + '@media (max-width:700px){'
    + '.psmenu-pshs-lunch table.psmenu-pshs-lunch-cal{display:none;}'
    + '.psmenu-pshs-lunch-cal-compact{display:block;}'
    + '}'
    + '@media print{'
    + '.psmenu-pshs-lunch .psmenu-pshs-lunch-nav,.psmenu-pshs-lunch .psmenu-pshs-lunch-toggle{display:none !important;}'
    + '.psmenu-pshs-lunch-cal-compact{display:none !important;}'
    + '.psmenu-pshs-lunch table.psmenu-pshs-lunch-cal{display:table !important;}'
    + '}';

  function injectStyleOnce() {
    if (document.getElementById('psmenu-pshs-lunch-style')) return;
    var style = document.createElement('style');
    style.id = 'psmenu-pshs-lunch-style';
    style.textContent = CSS;
    document.head.appendChild(style);
  }

  // ── Widget ────────────────────────────────────────────────────────────

  function Widget(el, config) {
    config = config || {};
    this.el = el;
    this.school = config.school || el.getAttribute('data-school');
    this.menutype = config.menutype || el.getAttribute('data-menutype');
    this.displayName = config.displayName || el.getAttribute('data-display-name')
      || SCHOOL_NAMES[this.school] || this.school;
    this.view = (config.view || el.getAttribute('data-view')) === 'week' ? 'week' : 'calendar';
    var today = new Date();
    this.year = today.getFullYear();
    this.month = today.getMonth() + 1;
    this.monday = getMonday(today);
  }

  Widget.prototype.init = function () {
    injectStyleOnce();
    this.el.classList.add('psmenu-pshs-lunch');
    if (!this.school || !this.menutype) {
      this.el.innerHTML = '<p class="psmenu-pshs-lunch-status">Menu embed is missing data-school / data-menutype.</p>';
      return;
    }
    // The visible label only ever shows the current month/week — no school
    // name or "Lunch"/"Breakfast" text, since the host page's own title
    // already covers that. Give the region an accessible name directly so
    // screen reader users tabbing in still get that context.
    this.el.setAttribute('role', 'region');
    this.el.setAttribute('aria-label', this.displayName + ' ' + cap(this.menutype) + ' menu');
    this.render(false);
  };

  Widget.prototype.getItemMap = function () {
    return fetchRollup(this.school, this.menutype);
  };

  // moveFocus is true only for user-initiated navigation (prev/next/today/
  // view toggle), never on the initial page-load render — moving focus on
  // load would be jarring and unexpected. A blanket aria-live region on this
  // whole container would work for announcing updates too, but every
  // navigation swaps in an entire month's worth of menu items, and a
  // "polite" live region would read all of that out loud on every click.
  // Moving focus to the heading instead announces just "September 2026" via
  // the normal focus-change announcement, which is what a sighted user
  // effectively "sees" happen too.
  Widget.prototype.render = function (moveFocus) {
    this.el.innerHTML = '<p class="psmenu-pshs-lunch-status">Loading menu&hellip;</p>';
    if (this.view === 'calendar') this.renderCalendar(moveFocus);
    else this.renderWeek(moveFocus);
  };

  Widget.prototype.focusHeading = function () {
    var target = this.el.querySelector('.psmenu-pshs-lunch-announce');
    if (target) target.focus();
  };

  // ── Month / calendar view ────────────────────────────────────────────

  Widget.prototype.renderCalendar = function (moveFocus) {
    var self = this;
    this.getItemMap().then(function (itemMap) {
      self._itemMap = itemMap || {};
      self.el.innerHTML = self.buildCalendarHTML(itemMap, self.year, self.month);
      self.bindCalendarNav();
      self.bindCompactDayClicks();
      if (moveFocus) self.focusHeading();
    });
  };

  Widget.prototype.buildCalendarHTML = function (itemMap, year, month) {
    var fetchFailed = itemMap === null;
    itemMap = itemMap || {};

    var first = new Date(year, month - 1, 1);
    var numDays = daysInMonth(year, month);
    var weekStart = getMonday(first);

    var weeks = [];
    var cur = new Date(weekStart);
    var lastOfMonth = new Date(year, month - 1, numDays);
    while (cur <= lastOfMonth) {
      var week = [];
      for (var i = 0; i < 5; i++) {
        var d = addDays(cur, i);
        week.push(d.getMonth() === month - 1 ? d : null);
      }
      weeks.push(week);
      cur = addDays(cur, 7);
    }

    var headerCells = DAYS.map(function (d) { return '<th scope="col">' + d + '</th>'; }).join('');

    var rowsHtml = weeks.map(function (week) {
      var cells = week.map(function (d, i) {
        var dayName = DAYS[i];
        if (!d) return '<td class="psmenu-pshs-lunch-empty" data-day="' + esc(dayName) + '"></td>';
        var key = dateKey(d);
        var items = itemMap[key] || [];
        var itemsHtml = items.length
          ? '<ul class="psmenu-pshs-lunch-cal-items">' + items.map(function (it) { return '<li>' + esc(it) + '</li>'; }).join('') + '</ul>'
          : '';
        return '<td data-day="' + esc(dayName) + '">'
          + '<span class="psmenu-pshs-lunch-sr-only">' + esc(fmtDateLong(d)) + ': </span>'
          + '<span class="psmenu-pshs-lunch-daynum" aria-hidden="true">' + d.getDate() + '</span>'
          + itemsHtml + '</td>';
      }).join('');
      return '<tr>' + cells + '</tr>';
    }).join('');

    var monthLabel = MONTH_NAMES[month] + ' ' + year;
    var noDataNote = fetchFailed
      ? '<p class="psmenu-pshs-lunch-status">Sorry, the menu couldn&rsquo;t be loaded right now. Please try again later.</p>'
      : '';

    // Default selected day for the mobile compact grid: today, if today
    // falls in the month being displayed; otherwise the first weekday of
    // that month, so navigating to a past/future month always lands on a
    // sensible day instead of nothing being selected.
    var todayD = new Date();
    var isCurrentMonth = todayD.getFullYear() === year && todayD.getMonth() + 1 === month;
    var defaultSelected = isCurrentMonth ? todayD : null;
    if (!defaultSelected) {
      for (var wi = 0; wi < weeks.length && !defaultSelected; wi++) {
        for (var di = 0; di < weeks[wi].length; di++) {
          if (weeks[wi][di]) { defaultSelected = weeks[wi][di]; break; }
        }
      }
    }
    this._selectedKey = defaultSelected ? dateKey(defaultSelected) : null;

    var compactHtml = this.buildCompactCalendarHTML(itemMap, weeks, todayD, defaultSelected);

    return ''
      + '<div class="psmenu-pshs-lunch-head">'
      + '<p class="psmenu-pshs-lunch-announce" tabindex="-1">' + esc(monthLabel) + '</p>'
      + '<nav class="psmenu-pshs-lunch-nav" aria-label="Month navigation">'
      + '<button type="button" data-nav="today">Today</button>'
      + '<button type="button" data-nav="prev" aria-label="Previous month">&larr;</button>'
      + '<button type="button" data-nav="next" aria-label="Next month">&rarr;</button>'
      + '<button type="button" data-nav="print" class="psmenu-pshs-lunch-print">Print</button>'
      + '</nav></div>'
      + noDataNote
      + '<table class="psmenu-pshs-lunch-cal"><caption>' + esc(cap(this.menutype)) + ' menu &mdash; ' + esc(this.displayName) + ' &mdash; ' + esc(monthLabel) + '</caption>'
      + '<thead><tr>' + headerCells + '</tr></thead><tbody>' + rowsHtml + '</tbody></table>'
      + compactHtml
      + '<div class="psmenu-pshs-lunch-toggle"><button type="button" data-nav="list">List View</button></div>';
  };

  Widget.prototype.buildCompactCalendarHTML = function (itemMap, weeks, todayD, selected) {
    var self = this;
    var headCells = DAYS.map(function (d) {
      return '<div class="psmenu-pshs-lunch-mg-head" aria-hidden="true">' + d.slice(0, 1) + '</div>';
    }).join('');

    var cellsHtml = weeks.map(function (week) {
      return week.map(function (d) {
        if (!d) return '<div class="psmenu-pshs-lunch-mg-cell psmenu-pshs-lunch-mg-empty"></div>';
        var key = dateKey(d);
        var hasItems = (itemMap[key] || []).length > 0;
        var isToday = sameDay(d, todayD);
        var isSelected = selected && key === dateKey(selected);
        var cls = 'psmenu-pshs-lunch-mg-cell'
          + (isToday ? ' today' : '')
          + (isSelected ? ' selected' : '')
          + (hasItems ? ' has-items' : '');
        return '<button type="button" class="' + cls + '" data-date="' + key + '" aria-pressed="' + (isSelected ? 'true' : 'false') + '" '
          + 'aria-label="' + esc(fmtDateLong(d)) + (hasItems ? ', menu available' : ', no menu') + '">'
          + '<span aria-hidden="true">' + d.getDate() + '</span>'
          + (hasItems ? '<span class="psmenu-pshs-lunch-mg-dot" aria-hidden="true"></span>' : '')
          + '</button>';
      }).join('');
    }).join('');

    return '<div class="psmenu-pshs-lunch-cal-compact">'
      + '<div class="psmenu-pshs-lunch-minigrid" role="group" aria-label="Choose a day">' + headCells + cellsHtml + '</div>'
      + '<div class="psmenu-pshs-lunch-daydetail" aria-live="polite">' + this.buildDayDetailHTML(itemMap, selected) + '</div>'
      + '</div>';
  };

  Widget.prototype.buildDayDetailHTML = function (itemMap, d) {
    if (!d) return '<p class="psmenu-pshs-lunch-status">Pick a day above to see its menu.</p>';
    var items = itemMap[dateKey(d)] || [];
    var isToday = sameDay(d, new Date());
    var itemsHtml = items.length
      ? '<ul class="psmenu-pshs-lunch-items">' + items.map(function (it) { return '<li>' + esc(it) + '</li>'; }).join('') + '</ul>'
      : '<p class="psmenu-pshs-lunch-no-menu">No menu available</p>';
    return '<div class="psmenu-pshs-lunch-daydetail-head"><h3>' + esc(fmtDateLong(d))
      + (isToday ? ' <span class="psmenu-pshs-lunch-flag">Today</span>' : '') + '</h3></div>'
      + itemsHtml;
  };

  Widget.prototype.bindCompactDayClicks = function () {
    var self = this;
    var grid = this.el.querySelector('.psmenu-pshs-lunch-minigrid');
    var detail = this.el.querySelector('.psmenu-pshs-lunch-daydetail');
    if (!grid || !detail) return;
    grid.addEventListener('click', function (e) {
      var btn = e.target.closest && e.target.closest('[data-date]');
      if (!btn || btn.getAttribute('data-date') === self._selectedKey) return;
      self._selectedKey = btn.getAttribute('data-date');

      var cells = grid.querySelectorAll('.psmenu-pshs-lunch-mg-cell[data-date]');
      for (var i = 0; i < cells.length; i++) {
        var isSelected = cells[i].getAttribute('data-date') === self._selectedKey;
        cells[i].classList.toggle('selected', isSelected);
        cells[i].setAttribute('aria-pressed', isSelected ? 'true' : 'false');
      }
      detail.innerHTML = self.buildDayDetailHTML(self._itemMap, parseDateKey(self._selectedKey));
    });
  };

  Widget.prototype.bindCalendarNav = function () {
    var self = this;
    bindNav(this.el, {
      prev: function () { self.shiftMonth(-1); },
      next: function () { self.shiftMonth(1); },
      today: function () { var t = new Date(); self.year = t.getFullYear(); self.month = t.getMonth() + 1; self.render(true); },
      print: function () { window.print(); },
      list: function () { self.view = 'week'; self.render(true); }
    });
  };

  Widget.prototype.shiftMonth = function (delta) {
    var m = this.month + delta, y = this.year;
    if (m < 1) { m = 12; y -= 1; }
    if (m > 12) { m = 1; y += 1; }
    this.year = y; this.month = m;
    this.render(true);
  };

  // ── Week / list view ──────────────────────────────────────────────────

  Widget.prototype.renderWeek = function (moveFocus) {
    var self = this;
    this.getItemMap().then(function (itemMap) {
      self.el.innerHTML = self.buildWeekHTML(itemMap, self.monday);
      self.bindWeekNav();
      if (moveFocus) self.focusHeading();
    });
  };

  Widget.prototype.buildWeekHTML = function (itemMap, monday) {
    var fetchFailed = itemMap === null;
    itemMap = itemMap || {};
    var today = new Date();
    var friday = addDays(monday, 4);

    var rows = DAYS.map(function (dayName, i) {
      var d = addDays(monday, i);
      var key = dateKey(d);
      var items = itemMap[key] || [];
      var isToday = sameDay(d, today);
      var flag = isToday ? '<span class="psmenu-pshs-lunch-flag">Today</span>' : '';
      var itemsHtml = items.length
        ? '<ul class="psmenu-pshs-lunch-items">' + items.map(function (it) { return '<li>' + esc(it) + '</li>'; }).join('') + '</ul>'
        : '';
      return '<div class="psmenu-pshs-lunch-day' + (isToday ? ' today' : '') + '">'
        + '<div class="psmenu-pshs-lunch-day-head"><h3>' + esc(dayName) + flag + '</h3>'
        + '<span class="psmenu-pshs-lunch-date">' + esc(fmtDateFull(d)) + '</span></div>'
        + '<div class="psmenu-pshs-lunch-day-body">' + itemsHtml + '</div></div>';
    }).join('');

    var noDataNote = fetchFailed
      ? '<p class="psmenu-pshs-lunch-status">Sorry, the menu couldn&rsquo;t be loaded right now. Please try again later.</p>'
      : '';

    var weekLabel = fmtDate(monday) + ' – ' + fmtDate(friday) + ', ' + monday.getFullYear();

    return ''
      + '<div class="psmenu-pshs-lunch-head">'
      + '<p class="psmenu-pshs-lunch-announce" tabindex="-1">' + esc(weekLabel) + '</p>'
      + '<nav class="psmenu-pshs-lunch-nav" aria-label="Week navigation">'
      + '<button type="button" data-nav="today">Today</button>'
      + '<button type="button" data-nav="prev" aria-label="Previous week">&larr;</button>'
      + '<button type="button" data-nav="next" aria-label="Next week">&rarr;</button>'
      + '<button type="button" data-nav="print" class="psmenu-pshs-lunch-print">Print</button>'
      + '</nav></div>'
      + noDataNote
      + '<div class="psmenu-pshs-lunch-daylist">' + rows + '</div>'
      + '<div class="psmenu-pshs-lunch-toggle"><button type="button" data-nav="month">Month View</button></div>';
  };

  Widget.prototype.bindWeekNav = function () {
    var self = this;
    bindNav(this.el, {
      prev: function () { self.monday = addDays(self.monday, -7); self.render(true); },
      next: function () { self.monday = addDays(self.monday, 7); self.render(true); },
      today: function () { self.monday = getMonday(new Date()); self.render(true); },
      print: function () { window.print(); },
      month: function () { self.view = 'calendar'; self.render(true); }
    });
  };

  // ── Shared nav wiring ─────────────────────────────────────────────────

  function bindNav(root, handlers) {
    Object.keys(handlers).forEach(function (key) {
      var btn = root.querySelector('[data-nav="' + key + '"]');
      if (btn) btn.addEventListener('click', handlers[key]);
    });
  }

  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }


  var __script = document.currentScript;
  var __container = document.createElement('div');
  __script.parentNode.insertBefore(__container, __script.nextSibling);
  new Widget(__container, {
    school: "pshs",
    menutype: "lunch",
    displayName: "Poland Seminary High School"
  }).init();
})();
</script>
