<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Poland Schools Menu Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* ── Reset & base ─────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:      #07194a;
    --navy-mid:  #0d2870;
    --navy-card: #0f2f82;
    --accent:    #7cd0ff;
    --white:     #ffffff;
    --off-white: #d6e4ff;
    --gray:      #7a9cc6;
    --red:       #e84141;
    --gold:      #ffd166;

    --col: 5;
    --gap: 16px;
    --radius: 22px;
    --header-h: 128px;
  }

  html, body {
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: var(--navy);
    font-family: 'DM Sans', sans-serif;
    color: var(--white);
  }

  /* ── Noise texture overlay ────────────────────────────────────────── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 0; opacity: 0.6;
  }

  /* ── Main layout wrapper ──────────────────────────────────────────── */
  #app {
    position: relative; z-index: 2;
    display: flex; flex-direction: column;
    width: 1920px; height: 1080px;
    padding: 24px 30px 20px;
    gap: 16px;
  }

  /* ── Header ───────────────────────────────────────────────────────── */
  #header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: var(--header-h);
    background: linear-gradient(135deg, var(--navy-mid) 0%, #142f8a 100%);
    border-radius: var(--radius);
    padding: 0 40px;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 4px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
    flex-shrink: 0;
    overflow: hidden;
    position: relative;
    animation: headerIn 0.7s cubic-bezier(.16,1,.3,1) both;
    animation-delay: 0.1s;
  }

  @keyframes headerIn {
    from { opacity: 0; transform: translateY(-30px); }
    to   { opacity: 1; transform: none; }
  }

  /* Accent stripe */
  #header::before {
    content: '';
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 6px;
    background: var(--accent);
    border-radius: var(--radius) 0 0 var(--radius);
  }

  #header-left { display: flex; flex-direction: column; gap: 4px; }

  #meal-type-row { display: flex; align-items: center; gap: 20px; }

  #meal-icon {
    font-size: 72px;
    line-height: 1;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.35));
  }

  #meal-type {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 76px;
    line-height: 1;
    letter-spacing: 1px;
    color: var(--white);
    text-shadow: 0 2px 20px rgba(0,0,0,0.5);
  }

  #school-name {
    font-size: 30px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 1px;
  }

  #header-center {
    display: flex; flex-direction: column;
    align-items: center; gap: 6px;
  }

  #week-label {
    font-family: 'Baloo 2', sans-serif;
    font-size: 24px;
    line-height: 1;
    font-weight: 700;
    color: var(--off-white);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    opacity: 0.8;
  }

  #week-dates {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 64px;
    line-height: 1;
    letter-spacing: 1px;
    color: var(--white);
  }

  #header-right {
    display: flex; flex-direction: column;
    align-items: flex-end; gap: 8px;
  }

  #clock {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 64px;
    line-height: 1;
    letter-spacing: 1px;
    color: var(--accent);
    text-shadow: 0 0 20px rgba(124,208,255,0.4);
  }

  #date-display {
    font-size: 26px; font-weight: 500;
    color: var(--off-white); opacity: 0.75;
  }

  /* ── Day columns grid ─────────────────────────────────────────────── */
  #grid {
    display: grid;
    grid-template-columns: repeat(var(--col), 1fr);
    gap: var(--gap);
    flex: 1;
    min-height: 0;
  }

  /* ── Single day card ──────────────────────────────────────────────── */
  /* Read from across a cafeteria, so each card has exactly one hero: the
     main entrée, big and bold. Sides sit underneath in smaller, softer
     type, and every station after the first ("Fan Favorite") gets its own
     gold callout pinned to the card bottom, so it's always in the same
     spot and you can compare both choices across the week at a glance.

     Every size is multiplied by --s, one scale shared by all five cards
     (set by fitCards() in JS), so the week reads as one consistent grid
     instead of each day picking its own font size. */
  .day-card {
    background: linear-gradient(170deg, #10307f 0%, #0a2161 100%);
    border-radius: var(--radius);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    display: flex; flex-direction: column;
    overflow: hidden;
    min-height: 0;
    animation: cardIn 0.6s cubic-bezier(.16,1,.3,1) both;
  }
  .day-card:nth-child(1) { animation-delay: 0.05s; }
  .day-card:nth-child(2) { animation-delay: 0.12s; }
  .day-card:nth-child(3) { animation-delay: 0.19s; }
  .day-card:nth-child(4) { animation-delay: 0.26s; }
  .day-card:nth-child(5) { animation-delay: 0.33s; }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(24px) scale(0.97); }
    to   { opacity: 1; transform: none; }
  }

  /* Days already served this week fade back so today and what's coming
     carry the visual weight. */
  /* (on the children: the card's own cardIn animation pins its opacity) */
  .day-card.past > * { opacity: 0.4; }

  .day-card.today {
    border: 3px solid var(--accent);
    box-shadow: 0 10px 40px rgba(124,208,255,0.28);
  }

  .day-header {
    padding: 16px 24px;
    background: rgba(255,255,255,0.06);
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .day-card.today .day-header { background: var(--accent); }

  .day-name {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 38px;
    line-height: 1;
    color: var(--white);
  }
  .day-card.today .day-name { color: var(--navy); }

  .day-date {
    font-size: 28px; font-weight: 600;
    color: var(--gray);
  }

  .today-badge {
    display: none;
    font-size: 22px; font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--navy);
    padding: 6px 16px;
    border-radius: 999px;
  }
  .day-card.today .today-badge { display: block; }
  .day-card.today .day-date    { display: none; }

  .day-body {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column;
    gap: calc(20px * var(--s, 1));
    padding: calc(22px * var(--s, 1)) 24px 22px;
    overflow: hidden;
  }

  .station-label {
    font-size: calc(19px * var(--s, 1));
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .entree {
    display: flex; align-items: flex-start; gap: 10px;
    margin-top: calc(6px * var(--s, 1));
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: calc(44px * var(--s, 1));
    line-height: 1.12;
    color: var(--white);
  }
  .entree-text { text-wrap: balance; min-width: 0; }
  .entree-with {
    display: block;
    margin-top: calc(4px * var(--s, 1));
    font-family: 'DM Sans', sans-serif;
    font-size: 0.6em;
    font-weight: 500;
    line-height: 1.2;
    color: var(--off-white);
  }
  .entree-emoji { font-size: 0.82em; line-height: 1.35; flex-shrink: 0; }

  .sides {
    list-style: none;
    display: flex; flex-direction: column;
    gap: calc(10px * var(--s, 1));
    margin-top: calc(16px * var(--s, 1));
    padding-top: calc(16px * var(--s, 1));
    border-top: 1px solid rgba(255,255,255,0.14);
  }
  .sides li {
    font-size: calc(28px * var(--s, 1));
    font-weight: 500;
    line-height: 1.2;
    color: var(--off-white);
    text-wrap: pretty;
  }

  .callout {
    margin-top: auto;
    padding: calc(16px * var(--s, 1)) 20px;
    border-radius: 16px;
    background: rgba(255,209,102,0.10);
    border: 1px solid rgba(255,209,102,0.45);
  }
  .callout .station-label { color: var(--gold); }
  .callout .station-label::before { content: '★ '; }
  .callout .entree { font-size: calc(36px * var(--s, 1)); }
  .callout .sides { border-top-color: rgba(255,209,102,0.25); }
  .callout .sides li { font-size: calc(24px * var(--s, 1)); }

  .no-menu {
    margin: auto;
    font-size: 34px;
    font-weight: 500;
    color: var(--gray);
    text-align: center;
  }

  /* ── Footer: the standing meal rules + legal line, static so nothing
     on the main screen moves while kids are trying to read it ─────── */
  #footer {
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between; gap: 40px;
    padding: 0 8px;
    font-size: 21px;
    color: var(--off-white);
    white-space: nowrap;
  }
  #footer strong { color: var(--accent); font-weight: 700; }
  #footer .foot-note { opacity: 0.65; text-align: right; }

  /* ── Error state ──────────────────────────────────────────────────── */
  #error-msg {
    display: none;
    position: fixed; inset: 0; z-index: 99;
    background: var(--navy);
    align-items: center; justify-content: center;
    flex-direction: column; gap: 16px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 48px;
    line-height: 1;
    color: var(--red);
    letter-spacing: 1px;
  }
  #error-msg p { font-family: 'DM Sans'; font-size: 22px; color: var(--gray); }

  /* ── Loading state ────────────────────────────────────────────────── */
  #loading {
    position: fixed; inset: 0; z-index: 100;
    background: var(--navy);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 20px;
    transition: opacity 0.5s ease, transform 0.5s cubic-bezier(.5,0,.75,0);
  }
  #loading.exit {
    opacity: 0;
    transform: scale(1.15);
    pointer-events: none;
  }
  #loading .logo {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 72px;
    line-height: 1;
    letter-spacing: 2px;
    color: var(--white);
    animation: logoPulse 1.4s ease-in-out infinite;
  }
  #loading .logo span { color: var(--accent); }
  @keyframes logoPulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.05); }
  }
  .spinner {
    width: 48px; height: 48px;
    border: 4px solid rgba(255,255,255,0.1);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Intro moment: meal title + raining emojis, plays once before the
     menu is revealed ──────────────────────────────────────────────────── */
  #intro {
    position: fixed; inset: 0; z-index: 100;
    background: radial-gradient(circle at 50% 38%, var(--navy-mid) 0%, var(--navy) 72%);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease, transform 0.6s cubic-bezier(.5,0,.75,0);
  }
  #intro.show { opacity: 1; pointer-events: auto; }
  #intro.exit { opacity: 0; transform: scale(1.15); }

  #intro-rain {
    position: absolute; inset: 0; z-index: 0;
    overflow: hidden; pointer-events: none;
  }
  .rain-emoji {
    position: absolute;
    top: -100px;
    opacity: 0;
    animation: rainFall linear infinite;
    user-select: none;
  }
  @keyframes rainFall {
    0%   { transform: translateY(0) rotate(0deg);      opacity: 0; }
    6%   { opacity: 0.85; }
    92%  { opacity: 0.85; }
    100% { transform: translateY(1220px) rotate(340deg); opacity: 0; }
  }

  #intro-content {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
  }

  #intro-icon {
    font-size: 170px;
    line-height: 1;
    filter: drop-shadow(0 6px 24px rgba(0,0,0,0.4));
    animation: introIconPop 0.7s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes introIconPop {
    0%   { opacity: 0; transform: scale(0.4) rotate(-10deg); }
    70%  { opacity: 1; transform: scale(1.12) rotate(4deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  #intro-title {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 200px;
    line-height: 1;
    letter-spacing: 4px;
    color: var(--white);
    text-shadow: 0 0 60px rgba(124,208,255,0.45), 0 4px 30px rgba(0,0,0,0.5);
    animation: introTitlePop 0.7s cubic-bezier(.16,1,.3,1) both;
    animation-delay: 0.12s;
  }
  @keyframes introTitlePop {
    0%   { opacity: 0; transform: scale(0.7) translateY(24px); }
    70%  { opacity: 1; transform: scale(1.04); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  #intro-sub {
    font-size: 30px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent);
    opacity: 0;
    animation: introFadeUp 0.6s ease both;
    animation-delay: 0.4s;
  }
  @keyframes introFadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 0.9; transform: none; }
  }

  /* ── Kid-friendly welcome burst, plays once when loading finishes ──── */
  #welcome-burst {
    position: fixed; inset: 0; z-index: 98;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  #welcome-burst span {
    position: absolute;
    font-size: 3.5rem;
    opacity: 0;
    animation: burst 0.9s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes burst {
    0%   { opacity: 0; transform: translate(0,0) scale(0.3); }
    30%  { opacity: 1; }
    100% { opacity: 0; transform: var(--burst-end) scale(1.1); }
  }
</style>
</head>
<body>

<!-- Loading overlay -->
<div id="loading">
  <div class="logo">Poland <span>Schools</span></div>
  <div class="spinner"></div>
</div>

<!-- Intro moment: meal title + raining emojis, plays once before the menu shows -->
<div id="intro">
  <div id="intro-rain"></div>
  <div id="intro-content">
    <div id="intro-icon" aria-hidden="true">🍽️</div>
    <div id="intro-title">—</div>
    <div id="intro-sub">—</div>
  </div>
</div>

<!-- Error overlay -->
<div id="error-msg">
  <div>⚠ Menu Unavailable</div>
  <p id="error-detail">Could not load menu data.</p>
</div>

<!-- One-time kid-friendly welcome burst, plays as the intro overlay exits -->
<div id="welcome-burst"></div>

<!-- Main app -->
<div id="app">
  <div id="header">
    <div id="header-left">
      <div id="meal-type-row">
        <div id="meal-icon" aria-hidden="true">🍽️</div>
        <div>
          <div id="meal-type">—</div>
          <div id="school-name">—</div>
        </div>
      </div>
    </div>
    <div id="header-center">
      <div id="week-label">Week of</div>
      <div id="week-dates">—</div>
    </div>
    <div id="header-right">
      <div id="clock">00:00</div>
      <div id="date-display">—</div>
    </div>
  </div>

  <div id="grid"></div>

  <div id="footer">
    <div><strong>Make it a meal:</strong> choose 3 to 5 items, including at least 1 fruit or veggie</div>
    <div class="foot-note">Menus subject to change · USDA is an equal opportunity provider, employer, and lender.</div>
  </div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────────────

const FOOD_EMOJIS = ['🍕','🥞','🍎','🥐','🧀','🥛','🍊','🥨','🍌','🥯',
                     '🍇','🥗','🍱','🧁','🍓','🥕','🌽','🍒','🥦','🍋'];

const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday'];

// Matched in order against an entrée's text; first hit wins. Only the
// entrée gets an emoji, and only when one actually matches — a random
// fallback on every line just added noise to the cards.
const ITEM_EMOJI_RULES = [
  [/pizza/i, '🍕'], [/pancake/i, '🥞'], [/waffle/i, '🧇'],
  [/french toast/i, '🍞'], [/chicken (nugget|tender|patt|strip)/i, '🍗'],
  [/(ham)?burger/i, '🍔'], [/hot ?dog|corn dog/i, '🌭'],
  [/taco|burrito|quesadilla|fajita|nacho/i, '🌮'], [/pasta|spaghetti|mac\s?(and|&|n)?\s?cheese/i, '🍝'],
  [/sandwich|\bsub\b|panini|wrap/i, '🥪'], [/salad/i, '🥗'], [/soup|chili/i, '🍲'],
  [/rice/i, '🍚'], [/bread|roll|biscuit|breadstick/i, '🥖'], [/bagel/i, '🥯'],
  [/muffin|donut|doughnut/i, '🍩'], [/cereal/i, '🥣'], [/yogurt|yoghurt/i, '🍦'],
  [/cheese\b/i, '🧀'], [/\bmilk\b/i, '🥛'], [/juice/i, '🧃'],
  [/\bapple/i, '🍎'], [/banana/i, '🍌'], [/orange|clementine|mandarin/i, '🍊'],
  [/grape/i, '🍇'], [/strawberr/i, '🍓'], [/peach/i, '🍑'], [/melon/i, '🍈'],
  [/pear\b/i, '🍐'], [/carrot/i, '🥕'], [/\bcorn\b/i, '🌽'], [/broccoli/i, '🥦'],
  [/potato|\bfries\b/i, '🍟'], [/veg(etable)?/i, '🥦'], [/\bfruit\b/i, '🍎'],
  [/cookie/i, '🍪'], [/ice cream/i, '🍨'],
];

function emojiForItem(text) {
  for (const [re, emoji] of ITEM_EMOJI_RULES) {
    if (re.test(text)) return emoji;
  }
  return '';
}

// ── Helpers ───────────────────────────────────────────────────────────────

const qs = (s) => document.querySelector(s);

function getParams() {
  const p = new URLSearchParams(window.location.search);
  return {
    school:   p.get('school')   || 'pshs',
    type:     p.get('type')     || 'breakfast',
  };
}

function getMonday(d) {
  const day = new Date(d);
  const diff = (day.getDay() + 6) % 7;
  day.setDate(day.getDate() - diff);
  day.setHours(0,0,0,0);
  return day;
}

function fmtDate(d) {
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
}

function fmtDateFull(d) {
  return d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
}

function dateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

// ── Clock ─────────────────────────────────────────────────────────────────

function startClock() {
  function tick() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    qs('#clock').textContent = `${h}:${m}`;
    qs('#date-display').textContent = fmtDateFull(now);
  }
  tick();
  setInterval(tick, 1000);
}

// ── Data loading ──────────────────────────────────────────────────────────

async function loadData(school, type) {
  const filename = `${type}-${school}.json`;
  const url = `https://raw.githubusercontent.com/nruggieri-poland/menus/refs/heads/master/data/${filename}`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`HTTP ${resp.status} for ${url}`);
  return resp.json();
}

// date -> [{title, items}] — Nutrislice's station groups ("Homestyle",
// "Fan Favorite"). Days saved before sections were captured fall back to
// one untitled group.
function buildItemMap(data) {
  const map = {};
  for (const day of data.days || []) {
    map[day.date] = (day.sections && day.sections.length)
      ? day.sections
      : [{ title: null, items: day.items || [] }];
  }
  return map;
}

// ── Render ────────────────────────────────────────────────────────────────

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

// One station: optional label, the first item as the hero entrée (it's
// always the entrée in Nutrislice's ordering), the rest as a sides list.
function renderStation(section) {
  const frag = document.createDocumentFragment();
  if (section.title) frag.appendChild(el('div', 'station-label', section.title));
  const [entree, ...sides] = section.items;
  const entreeEl = el('div', 'entree');
  const emoji = emojiForItem(entree);
  if (emoji) entreeEl.appendChild(el('span', 'entree-emoji', emoji));
  // "Popcorn Chicken Bowl w/ Fresh Bread": the "with …" part drops to a
  // smaller second line so the dish name itself stays short and big.
  const m = entree.match(/^(.+?)\s+(?:w\/|with)\s*(.+)$/i);
  const textEl = el('span', 'entree-text', m ? m[1] : entree);
  if (m) textEl.appendChild(el('span', 'entree-with', 'with ' + m[2]));
  entreeEl.appendChild(textEl);
  frag.appendChild(entreeEl);
  if (sides.length) {
    const ul = el('ul', 'sides');
    sides.forEach(s => ul.appendChild(el('li', null, s)));
    frag.appendChild(ul);
  }
  return frag;
}

function renderWeek(itemMap, monday, schoolDisplay, type) {
  const todayKey = dateKey(new Date());

  // Header
  const friday = new Date(monday);
  friday.setDate(friday.getDate() + 4);
  qs('#meal-icon').textContent = MEAL_ICONS[type] || '🍽️';
  qs('#meal-type').textContent = type.charAt(0).toUpperCase() + type.slice(1);
  qs('#school-name').textContent = schoolDisplay;
  qs('#week-dates').textContent  = `${fmtDate(monday)} – ${fmtDate(friday)}`;

  // Grid
  const grid = qs('#grid');
  grid.innerHTML = '';

  DAYS.forEach((dayName, i) => {
    const d = new Date(monday);
    d.setDate(d.getDate() + i);
    const key = dateKey(d);
    const sections = (itemMap[key] || []).filter(s => s.items.length);

    const card = el('div', 'day-card' + (key === todayKey ? ' today' : key < todayKey ? ' past' : ''));

    const header = el('div', 'day-header');
    header.appendChild(el('span', 'day-name', dayName));
    header.appendChild(el('span', 'day-date', fmtDate(d)));
    header.appendChild(el('span', 'today-badge', 'Today'));
    card.appendChild(header);

    const body = el('div', 'day-body');
    if (sections.length === 0) {
      body.appendChild(el('div', 'no-menu', 'No menu today'));
    } else {
      // First station is the main block; any later ones ("Fan Favorite")
      // become the callout at the bottom of the card.
      const main = el('div', 'station');
      main.appendChild(renderStation(sections[0]));
      body.appendChild(main);
      sections.slice(1).forEach(section => {
        const callout = el('div', 'callout');
        callout.appendChild(renderStation(section));
        body.appendChild(callout);
      });
    }
    card.appendChild(body);
    grid.appendChild(card);
  });

  fitCards(grid);
}

// ── Auto-fit ─────────────────────────────────────────────────────────────
// One scale (--s) for the whole week, so all five cards share the same
// type sizes. Starts a bit above 1 (a 3-item breakfast week gets bigger
// type) and steps down until the fullest card fits. SCALE_MIN is a floor,
// not a typical value — real lunch weeks settle near 1.

const SCALE_MAX = 1.2;
const SCALE_MIN = 0.6;

function fitCards(grid) {
  const bodies = [...grid.querySelectorAll('.day-body')];
  // Width too: one long word ("Cheeseburger") can be wider than a column
  // and would clip sideways without ever making the card taller.
  const overflowing = () => bodies.some(b =>
    b.scrollHeight > b.clientHeight + 1 || b.scrollWidth > b.clientWidth + 1);
  let scale = SCALE_MAX;
  grid.style.setProperty('--s', scale);
  while (scale > SCALE_MIN && overflowing()) {
    scale = Math.round((scale - 0.02) * 100) / 100;
    grid.style.setProperty('--s', scale);
  }
}

// ── School display names ──────────────────────────────────────────────────

const SCHOOL_NAMES = {
  'pshs':            'Poland Seminary High School',
  'mckinley-middle': 'McKinley/Middle School',
};

const MEAL_ICONS = { breakfast: '🥞', lunch: '🍕' };

// ── Kid-friendly welcome burst ──────────────────────────────────────────────
// A one-time handful of big emojis flying outward from center as the
// intro overlay dismisses — plays once per page load (i.e. once per TV
// refresh cycle), not on every row/render.

function spawnWelcomeBurst(type) {
  const host = qs('#welcome-burst');
  const emojis = [MEAL_ICONS[type] || '🍽️', ...FOOD_EMOJIS.slice(0, 7)];
  emojis.forEach((emoji, i) => {
    const el = document.createElement('span');
    el.textContent = emoji;
    const angle = (i / emojis.length) * Math.PI * 2;
    const dist = 260 + Math.random() * 160;
    el.style.setProperty('--burst-end', `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`);
    el.style.animationDelay = (i * 0.03) + 's';
    host.appendChild(el);
  });
  setTimeout(() => { host.innerHTML = ''; }, 1200);
}

function dismissLoading() {
  qs('#loading').style.display = 'none';
}

// ── Intro moment ─────────────────────────────────────────────────────────
// A 3.5s title card (meal type, big) with food emojis raining in the
// background, shown once per page load right before the menu is revealed.

const INTRO_DURATION_MS = 3500;

function spawnIntroRain() {
  const wrap = qs('#intro-rain');
  wrap.innerHTML = '';
  for (let i = 0; i < 45; i++) {
    const el = document.createElement('div');
    el.className = 'rain-emoji';
    el.textContent = FOOD_EMOJIS[Math.floor(Math.random() * FOOD_EMOJIS.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.fontSize = (2.2 + Math.random() * 2.6) + 'rem';
    el.style.animationDuration = (2 + Math.random() * 2.4) + 's';
    el.style.animationDelay = -(Math.random() * 4.4) + 's';
    wrap.appendChild(el);
  }
}

function showIntro(type, schoolDisplay) {
  return new Promise((resolve) => {
    qs('#intro-icon').textContent = MEAL_ICONS[type] || '🍽️';
    qs('#intro-title').textContent = type.charAt(0).toUpperCase() + type.slice(1);
    qs('#intro-sub').textContent = schoolDisplay;
    spawnIntroRain();

    const intro = qs('#intro');
    requestAnimationFrame(() => intro.classList.add('show'));

    setTimeout(() => {
      intro.classList.add('exit');
      spawnWelcomeBurst(type);
      setTimeout(() => {
        intro.style.display = 'none';
        resolve();
      }, 600);
    }, INTRO_DURATION_MS);
  });
}

// ── Boot ──────────────────────────────────────────────────────────────────

async function boot() {
  startClock();

  const { school, type } = getParams();
  const schoolDisplay = SCHOOL_NAMES[school] || school;

  const today    = new Date();
  const monday   = getMonday(today);
  // Saturday/Sunday: last week is over, so show the week coming up.
  if (today.getDay() === 0 || today.getDay() === 6) monday.setDate(monday.getDate() + 7);

  let itemMap = {};
  try {
    const data = await loadData(school, type);
    itemMap = buildItemMap(data);
  } catch(e) {
    console.warn('Menu data load failed:', e);
  }

  if (Object.keys(itemMap).length === 0) {
    qs('#loading').style.display    = 'none';
    qs('#error-msg').style.display  = 'flex';
    qs('#error-detail').textContent = `No data found for ${school} / ${type}`;
    return;
  }

  dismissLoading();
  await showIntro(type, schoolDisplay);

  renderWeek(itemMap, monday, schoolDisplay, type);

  // Auto-refresh at midnight to flip to next week
  const msUntilMidnight = new Date().setHours(24,0,5,0) - Date.now();
  setTimeout(() => location.reload(), msUntilMidnight);
}

boot().catch(err => {
  console.error(err);
  qs('#loading').style.display   = 'none';
  qs('#error-msg').style.display = 'flex';
  qs('#error-detail').textContent = err.message;
});
</script>
